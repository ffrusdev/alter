# Builds and tests Alter on real Windows and Linux machines, then publishes a GitHub release.
# Runs on every push to main. It only releases when the version in the VERSION file has no
# release yet, so to publish a new version: change VERSION (e.g. 1.1.1), update
# .github/RELEASE_NOTES.md, and push. Can also be run by hand from the Actions tab.
name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Alter.ps1 parses in Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\Alter.ps1), [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Host "$($_.Extent.StartLineNumber): $($_.Message)" }; throw 'Alter.ps1 has syntax errors' }
          Write-Host "PowerShell $($PSVersionTable.PSVersion): Alter.ps1 parses cleanly"

      - name: Build Alter.exe
        shell: powershell
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ /win32icon:logo\alter.ico /out:Alter.exe src\AlterLauncher.cs
          if ($LASTEXITCODE -ne 0) { throw 'csc failed' }
          Get-Item .\Alter.exe | Format-List Name, Length

      - name: Smoke test - make a copy of Notepad from the command line
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Alter.ps1 -Name 'CI Test' -Target "$env:WINDIR\System32\notepad.exe" -NoDesktopShortcut
          if ($LASTEXITCODE -ne 0) { throw "Alter exited with $LASTEXITCODE" }
          $dir = Join-Path $env:LOCALAPPDATA 'ParallWin\CI Test'
          foreach ($f in 'config.txt', 'icon.ico', 'CI Test.exe') {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $f))) { throw "missing $f" }
          }
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Alter\CI Test.lnk'
          if (-not (Test-Path -LiteralPath $lnk)) { throw 'Start Menu shortcut missing' }
          Get-Content (Join-Path $dir 'config.txt')
          Write-Host 'Smoke test passed'

      - name: List installed apps with their verdicts (what Browse shows)
        shell: powershell
        run: |
          $out = powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Alter.ps1 -ListApps | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "Alter -ListApps exited with $LASTEXITCODE" }
          if ($out -notmatch "Works\s+(Google Chrome|Microsoft Edge)") { throw 'expected Chrome or Edge to be listed as Works' }

      - name: Package Alter.zip
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist\Alter | Out-Null
          Copy-Item Alter.exe, Alter.ps1, 'Start Alter.cmd', Test-Alter.ps1, README.md, LICENSE -Destination dist\Alter
          Copy-Item fonts, logo, src -Destination dist\Alter -Recurse
          Compress-Archive -Path dist\Alter -DestinationPath Alter.zip -Force
          Get-Item .\Alter.zip | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Alter.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test (including two real Chrome copies on a virtual display)
        run: |
          sudo apt-get install -y -qq desktop-file-utils >/dev/null
          ALTER_TEST_BROWSER="$(command -v google-chrome)" xvfb-run -a python3 linux/test_alter.py

      - name: Package alter-linux.tar.gz
        run: |
          mkdir -p dist/alter-linux/logo
          cp linux/alter linux/install.sh linux/README.md LICENSE dist/alter-linux/
          cp logo/alter-logo.svg dist/alter-linux/logo/
          tar -C dist -czf alter-linux.tar.gz alter-linux
          tar -tzf alter-linux.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: alter-linux.tar.gz

  release:
    needs: [windows, linux]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Publish the release (only if this version has none yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi
          gh release create "$tag" windows/Alter.zip linux/alter-linux.tar.gz \
            --target "$GITHUB_SHA" --title "Alter $version" --notes-file .github/RELEASE_NOTES.md
          echo "Published $tag"
